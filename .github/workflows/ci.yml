name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - name: Existing build, test, and integration pipeline
        shell: pwsh
        run: ./scripts/ci.ps1 -SkipAnalyze
  analysis:
    name: analysis
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure MSVC analysis for project targets
        run: cmake -G "Visual Studio 17 2022" -B build-analyze -DAKAV_ENABLE_ANALYZE=ON -DAKAV_BUILD_TESTS=OFF
      - name: Build with analysis and warnings as errors
        run: cmake --build build-analyze --config Release --target akesoav akavscan
